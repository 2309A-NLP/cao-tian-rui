<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小家专属记账本</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #f5f5f5; height:100vh; display:flex; flex-direction:column;
}
header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff; padding: 12px 24px; display:flex; align-items:center;
  justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
header h1 { font-size: 18px; font-weight: 600; }
header .sub { font-size: 12px; opacity: .85; }

/* 聊天区 */
#chat-container {
  flex:1; overflow-y:auto; padding: 20px; display:flex; flex-direction:column; gap:12px;
}
.msg { max-width:85%; padding:10px 16px; border-radius:12px; line-height:1.6; font-size:15px; word-break:break-word; }
.msg.user { align-self:flex-end; background:#667eea; color:#fff; border-bottom-right-radius:4px; }
.msg.assistant { align-self:flex-start; background:#fff; color:#333; border-bottom-left-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.msg.system { align-self:center; background:#f0f0f0; color:#888; font-size:12px; max-width:95%; border-radius:6px; padding:6px 12px; }
.msg.tool { align-self:center; background:#fffbe6; color:#b8860b; font-size:12px; max-width:90%; border-radius:6px; padding:6px 12px; border:1px dashed #f0d060; }
.msg .meta { font-size:11px; opacity:.6; margin-bottom:4px; }

/* 输入区 */
#input-area {
  padding:16px 20px; background:#fff; border-top:1px solid #e0e0e0; display:flex; gap:10px;
}
#input-area input {
  flex:1; padding:10px 16px; border:2px solid #e0e0e0; border-radius:24px; font-size:15px;
  outline:none; transition:border-color .2s;
}
#input-area input:focus { border-color:#667eea; }
#input-area button {
  padding:10px 24px; border:none; border-radius:24px; background:#667eea; color:#fff;
  font-size:15px; cursor:pointer; transition:background .2s; font-weight:600;
}
#input-area button:hover { background:#5a6fd6; }
#input-area button:disabled { background:#ccc; cursor:not-allowed; }

/* 快捷测试 */
#quick-tests {
  padding:8px 20px; background:#fafafa; border-top:1px solid #eee; display:flex;
  gap:8px; overflow-x:auto; flex-wrap:wrap;
}
#quick-tests button {
  padding:5px 12px; border:1px solid #ddd; border-radius:14px; background:#fff;
  font-size:12px; cursor:pointer; white-space:nowrap; transition:all .2s;
}
#quick-tests button:hover { border-color:#667eea; color:#667eea; background:#f5f7ff; }

/* loading */
.loading { display:inline-block; width:8px; height:8px; border-radius:50%; background:#667eea; animation:bounce 1.4s infinite ease-in-out; margin:0 3px; }
.loading:nth-child(2){ animation-delay:.2s; }
.loading:nth-child(3){ animation-delay:.4s; }
@keyframes bounce { 0%,80%,100%{ transform:scale(0); } 40%{ transform:scale(1); } }

/* 状态标签 */
.status { font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,.2); }
.status.ok { background:#4caf50; }
.status.err { background:#f44336; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🏠 小家专属记账本</h1>
    <div class="sub">工单编号：人工智能 NLP-Agent 数字人项目-记账本任务</div>
  </div>
  <div>
    <span id="status" class="status">连接中...</span>
  </div>
</header>

<div id="chat-container"></div>

<div id="quick-tests">
  <span style="font-size:12px;color:#999;line-height:28px;">快捷测试：</span>
  <button onclick="sendMsg('今天女儿买了双登山鞋 499 元')">记账测试</button>
  <button onclick="sendMsg('7 月 5 日妈妈收到报销 1000 元')">收入测试</button>
  <button onclick="sendMsg('看下这个月家里花钱明细')">汇总查询</button>
  <button onclick="sendMsg('这个月女儿花了多少钱？')">成员查询</button>
  <button onclick="sendMsg('删除女儿报旅游团的费用')">删除测试</button>
  <button onclick="sendMsg('我今天买三体花了 50 元')">缺成员追问</button>
</div>

<div id="input-area">
  <input id="msgInput" placeholder='输入记账信息，如："今天女儿买了双登山鞋499元"'
         onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="sendBtn" onclick="sendMsg()">发送</button>
</div>

<script>
const API = '/api/chat/stream';
const SESSION_KEY = 'money_book_session_id';
let sessionId = localStorage.getItem(SESSION_KEY) || '';
let isProcessing = false;

// 工具调用名称中文映射
const TOOL_NAMES = {
  add_record: '📝 正在记账...',
  query_records: '🔍 正在查询...',
  delete_record: '🗑️ 正在处理删除...',
  get_summary: '📊 正在汇总...'
};

function addMsg(role, text, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (meta) div.innerHTML = `<div class="meta">${meta}</div>${text}`;
  else div.textContent = text;
  document.getElementById('chat-container').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return div;
}

function addStreamMsg(role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.id = 'stream-msg';
  document.getElementById('chat-container').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return div;
}

async function sendMsg(text) {
  if (isProcessing) return;
  const input = document.getElementById('msgInput');
  const msg = text || input.value.trim();
  if (!msg) return;
  input.value = '';
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('status').textContent = '处理中...';
  document.getElementById('status').className = 'status';

  addMsg('user', msg);

  // 移除旧的 stream-msg
  const old = document.getElementById('stream-msg');
  if (old) old.id = '';

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let streamDiv = null;
    let fullReply = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));
          switch (event.type) {
            case 'token':
              if (!streamDiv) streamDiv = addStreamMsg('assistant');
              fullReply += event.content;
              streamDiv.textContent = fullReply;
              streamDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
              break;
            case 'tool_call':
              addMsg('tool', TOOL_NAMES[event.name] || `调用 ${event.name}`, event.name);
              break;
            case 'tool_result':
              // 不显示详细结果，只在 tool 消息中展示
              break;
            case 'done':
              sessionId = event.session_id;
              localStorage.setItem(SESSION_KEY, sessionId);
              if (streamDiv) streamDiv.id = '';
              if (fullReply) {
                // 更新最后一条 assistant 消息
                const msgs = document.querySelectorAll('.msg.assistant');
                if (msgs.length) msgs[msgs.length-1].textContent = fullReply;
              }
              break;
          }
        } catch(e) {}
      }
    }
    document.getElementById('status').textContent = '就绪';
    document.getElementById('status').className = 'status ok';
  } catch(e) {
    addMsg('system', '请求失败: ' + e.message);
    document.getElementById('status').textContent = '错误';
    document.getElementById('status').className = 'status err';
  }
  isProcessing = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

// 页面加载：自动获取开场白
fetch('/api/welcome')
  .then(r => r.json())
  .then(d => {
    sessionId = d.session_id;
    localStorage.setItem(SESSION_KEY, sessionId);
    addMsg('assistant', d.reply);
    document.getElementById('status').textContent = '就绪';
    document.getElementById('status').className = 'status ok';
  })
  .catch(() => {
    addMsg('system', '连接后端服务失败，请检查服务是否启动');
    document.getElementById('status').textContent = '连接失败';
    document.getElementById('status').className = 'status err';
  });

document.getElementById('msgInput').focus();
</script>
</body>
</html>
