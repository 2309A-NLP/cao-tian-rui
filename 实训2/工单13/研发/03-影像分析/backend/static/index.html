<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影像分析 - 医疗智能体</title>
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#F0FDFA;color:#134E4A;height:100vh;padding:20px;overflow:hidden}

/* ===== Layout ===== */
.container{max-width:1280px;margin:0 auto;display:flex;gap:16px;height:calc(100vh - 40px)}
.main-panel{flex:1;background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:24px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.side-panel{width:340px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}

/* ===== Header ===== */
.header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-shrink:0}
.header-icon{font-size:28px}
.header-title{font-size:20px;font-weight:600;color:#134E4A}
.health-dot{width:8px;height:8px;border-radius:50%;background:#D1D5DB;margin-left:auto;transition:background .3s}
.health-dot.ok{background:#10B981}
.health-dot.err{background:#EF4444}

/* ===== Tabs ===== */
.feature-tabs{display:flex;gap:8px;margin-bottom:16px;flex-shrink:0}
.feature-tab{padding:8px 18px;border-radius:8px;font-size:13px;cursor:pointer;background:#F0FDFA;color:#5F7976;transition:all .2s;user-select:none;white-space:nowrap}
.feature-tab.active{background:linear-gradient(135deg,#0D9488,#06B6D4);color:#fff;box-shadow:0 2px 8px rgba(13,148,136,.3)}
.feature-tab:hover:not(.active){background:#E5F5F2;color:#0D9488}

/* ===== Upload Zone ===== */
.upload-zone{border:2px dashed #CDECE8;border-radius:12px;padding:40px 24px;text-align:center;background:#FAFEFD;transition:all .2s;cursor:pointer;flex-shrink:0}
.upload-zone:hover,.upload-zone.dragover{border-color:#0D9488;background:#F0FDFA}
.upload-zone.dragover{background:#E5F5F2}
.upload-icon{font-size:42px;margin-bottom:10px}
.upload-title{font-size:15px;font-weight:600;margin-bottom:6px}
.upload-sub{font-size:13px;color:#5F7976;margin-bottom:16px}

/* ===== Upload Info Bar ===== */
.upload-info{display:none;align-items:center;gap:12px;padding:10px 14px;background:#F0FDFA;border-radius:10px;border:1px solid #CDECE8;margin-bottom:12px;font-size:13px;flex-shrink:0}
.upload-info-name{flex:1;color:#0D9488;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Buttons ===== */
.btn{padding:9px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#0D9488,#06B6D4);color:#fff;box-shadow:0 2px 6px rgba(13,148,136,.25)}
.btn-primary:hover{box-shadow:0 4px 12px rgba(13,148,136,.4);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:#fff;border:1px solid #CDECE8;color:#0D9488}
.btn-outline:hover{border-color:#0D9488;background:#F0FDFA}
.btn-sm{padding:6px 14px;font-size:12px}

/* ===== Tab Panels ===== */
.tab-panel{flex:1;display:none;flex-direction:column;overflow:hidden;min-height:0}
.tab-panel.active{display:flex}

/* ===== Empty State ===== */
.empty-state{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#9CA3AF;font-size:14px;padding:40px}
.empty-state-icon{font-size:48px;opacity:.4}

/* ===== VQA Panel ===== */
.chat-history{flex:1;overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;gap:12px}
.chat-bubble{display:flex;gap:10px;align-items:flex-start}
.chat-bubble.user{flex-direction:row-reverse}
.chat-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chat-avatar.ai{background:linear-gradient(135deg,#0D9488,#06B6D4);color:#fff}
.chat-avatar.user-av{background:#E5F5F2;color:#0D9488}
.chat-content{max-width:80%;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6;background:#FAFEFD;border:1px solid #E5F5F2;word-break:break-word}
.chat-content.user{background:#F0FDFA;border-color:#CDECE8}
.chat-input-bar{display:flex;gap:8px;padding-top:12px;border-top:1px solid #F0FDFA;margin-top:8px;flex-shrink:0}
.chat-input{flex:1;height:38px;border:1px solid #CDECE8;border-radius:19px;padding:0 16px;font-size:13px;color:#134E4A;outline:none;font-family:inherit}
.chat-input:focus{border-color:#0D9488}
.btn-send{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0D9488,#06B6D4);border:none;cursor:pointer;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.btn-send:hover{box-shadow:0 2px 8px rgba(13,148,136,.4)}
.btn-send:disabled{opacity:.5;cursor:not-allowed}

/* ===== Loading Dots ===== */
.loading-dots{display:flex;gap:4px;padding:10px 14px}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:#0D9488;animation:bounce .9s ease-in-out infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0.7);opacity:.5}40%{transform:scale(1);opacity:1}}

/* ===== MRG Panel ===== */
.mrg-actions{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0}
.mrg-hint{font-size:12px;color:#9CA3AF}
.mrg-scroll{flex:1;overflow-y:auto}

/* ===== Report Card ===== */
.report-card{background:#FAFEFD;border:1px solid #E5F5F2;border-radius:12px;padding:20px;animation:fadeIn .3s ease}
.report-title{font-size:15px;font-weight:600;color:#134E4A;margin-bottom:10px}
.report-tags{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:500}
.tag-primary{background:#E5F5F2;color:#0D9488}
.tag-muted{background:#F3F4F6;color:#6B7280}
.tag-warn{background:#FEF3C7;color:#92400E}
.report-section{margin-bottom:14px}
.report-label{font-size:12px;color:#5F7976;margin-bottom:4px;font-weight:500}
.report-value{font-size:13px;color:#134E4A;line-height:1.6}
.report-disclaimer{font-size:11px;color:#9CA3AF;padding-top:12px;margin-top:12px;border-top:1px solid #F0FDFA;line-height:1.5}

/* ===== Loading Card ===== */
.loading-card{display:none;align-items:center;gap:12px;padding:16px;background:#F0FDFA;border-radius:10px;border:1px solid #CDECE8;color:#0D9488;font-size:13px;flex-shrink:0;margin-bottom:12px}
.spinner{width:18px;height:18px;border:2px solid #CDECE8;border-top-color:#0D9488;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== RAG Panel ===== */
.rag-search{display:flex;gap:8px;margin-bottom:14px;flex-shrink:0}
.rag-input{flex:1;height:40px;border:1px solid #CDECE8;border-radius:10px;padding:0 14px;font-size:13px;color:#134E4A;outline:none;font-family:inherit}
.rag-input:focus{border-color:#0D9488}
.rag-scroll{flex:1;overflow-y:auto}
.rag-answer{background:#FAFEFD;border:1px solid #E5F5F2;border-radius:10px;padding:16px;font-size:13px;line-height:1.7;color:#134E4A;margin-bottom:14px;animation:fadeIn .3s}
.refs-title{font-size:12px;font-weight:600;color:#5F7976;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.ref-item{background:#fff;border:1px solid #E5F5F2;border-radius:8px;padding:12px;margin-bottom:8px;animation:fadeIn .3s}
.ref-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ref-num{font-weight:600;color:#0D9488;font-size:12px}
.ref-title-text{font-size:12px;color:#134E4A;font-weight:500}
.ref-score{font-size:11px;color:#9CA3AF;margin-left:auto}
.ref-snippet{font-size:12px;color:#5F7976;line-height:1.6}
.no-refs{font-size:13px;color:#9CA3AF;padding:12px;text-align:center;background:#FAFEFD;border-radius:8px}

/* ===== Side Panel ===== */
.preview-card{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:16px}
.preview-card-title{font-weight:600;font-size:13px;margin-bottom:10px;color:#134E4A}
.preview-box{background:#0f172a;border-radius:12px;height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:zoom-in}
.preview-box img{width:100%;height:100%;object-fit:contain;display:none}
.preview-placeholder{color:#64748b;font-size:13px;text-align:center;line-height:1.6}
.preview-overlay{position:absolute;inset:0;border:2px solid #0D9488;border-radius:12px;pointer-events:none;display:none}
.action-buttons{display:flex;gap:6px;margin-top:10px}
.action-btn{flex:1;padding:7px 0;font-size:11px;text-align:center;border-radius:8px;cursor:pointer;background:#fff;border:1px solid #CDECE8;color:#0D9488;font-weight:500;transition:all .15s}
.action-btn:hover{background:#F0FDFA;border-color:#0D9488}
.action-btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== Info Card ===== */
.info-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:14px}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:12px}
.info-row+.info-row{border-top:1px solid #F0FDFA;padding-top:8px;margin-top:4px}
.info-label{color:#9CA3AF}
.info-value{color:#134E4A;font-weight:500}

/* ===== Latency ===== */
.latency-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:12px 14px;display:none;justify-content:space-between;align-items:center;font-size:12px}
.latency-value{font-weight:600;color:#0D9488}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1E293B;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#EF4444}
.toast.success{background:#10B981}

/* ===== Modal (Zoom) ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000;cursor:zoom-out}
.modal img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}

/* ===== Animations ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="container">
  <!-- ===== MAIN PANEL ===== -->
  <div class="main-panel">
    <!-- Header -->
    <div class="header">
      <span class="header-icon">🖼️</span>
      <span class="header-title">影像分析</span>
      <div class="health-dot" id="healthDot" title="服务状态"></div>
    </div>

    <!-- Tab Bar -->
    <div class="feature-tabs">
      <div class="feature-tab active" id="tab-vqa" onclick="switchTab('vqa')">VQA 视觉问答</div>
      <div class="feature-tab" id="tab-mrg" onclick="switchTab('mrg')">报告生成 (MRG)</div>
      <div class="feature-tab" id="tab-rag" onclick="switchTab('rag')">RAG 增强检索</div>
    </div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)"
         ondrop="handleDrop(event)"
         onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png" hidden onchange="handleFileInput(this)">
      <div class="upload-icon">📤</div>
      <div class="upload-title">拖拽影像文件到此处上传</div>
      <div class="upload-sub">支持 JPEG、PNG 格式，单文件不超过 20MB</div>
      <button class="btn btn-primary" onclick="event.stopPropagation();document.getElementById('fileInput').click()">选择文件</button>
    </div>

    <!-- Upload Info -->
    <div class="upload-info" id="uploadInfo">
      <span>📎</span>
      <span class="upload-info-name" id="uploadFileName"></span>
      <button class="btn btn-outline btn-sm" onclick="resetImage()">重新上传</button>
    </div>

    <!-- Empty State (shown when image not loaded but tab panel needs it) -->
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">🖼️</div>
      <div>请先上传影像文件</div>
      <div style="font-size:12px;color:#9CA3AF">支持 JPEG / PNG，≤ 20MB</div>
    </div>

    <!-- ===== VQA Panel ===== -->
    <div class="tab-panel" id="panel-vqa">
      <div class="chat-history" id="vqaHistory">
        <div class="chat-bubble">
          <div class="chat-avatar ai">🤖</div>
          <div class="chat-content">影像已加载，您可以针对影像内容提问。<br>例如：这是哪个部位的影像？有何异常发现？</div>
        </div>
      </div>
      <div class="chat-input-bar">
        <input type="text" class="chat-input" id="vqaInput"
               placeholder="输入问题，例如：这张影像显示的是什么？"
               onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendVQA()}">
        <button class="btn-send" id="vqaSend" onclick="sendVQA()" title="发送">&#10148;</button>
      </div>
    </div>

    <!-- ===== MRG Panel ===== -->
    <div class="tab-panel" id="panel-mrg">
      <div class="mrg-actions">
        <button class="btn btn-primary" id="mrgBtn" onclick="generateMRG()">🔬 生成影像诊断报告</button>
        <span class="mrg-hint">AI 自动分析影像并输出结构化报告</span>
      </div>
      <div class="loading-card" id="mrgLoading">
        <div class="spinner"></div>
        <span>正在分析影像，生成报告中...</span>
      </div>
      <div class="mrg-scroll">
        <div id="mrgReport" style="display:none"></div>
      </div>
    </div>

    <!-- ===== RAG Panel ===== -->
    <div class="tab-panel" id="panel-rag">
      <div class="rag-search">
        <input type="text" class="rag-input" id="ragInput"
               placeholder="输入问题，从医学知识库检索后增强回答..."
               onkeydown="if(event.key==='Enter'){event.preventDefault();sendRAG()}">
        <button class="btn btn-primary" id="ragBtn" onclick="sendRAG()">检索增强回答</button>
      </div>
      <div class="loading-card" id="ragLoading">
        <div class="spinner"></div>
        <span>正在检索医学知识库并生成增强回答...</span>
      </div>
      <div class="rag-scroll">
        <div id="ragResult" style="display:none">
          <div class="rag-answer" id="ragAnswer"></div>
          <div id="ragRefs"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== SIDE PANEL ===== -->
  <div class="side-panel">
    <!-- Image Preview -->
    <div class="preview-card">
      <div class="preview-card-title">影像预览</div>
      <div class="preview-box" id="previewBox" onclick="zoomImage()">
        <img id="previewImg" alt="影像预览">
        <div class="preview-placeholder" id="previewPlaceholder">等待上传...</div>
        <div class="preview-overlay" id="previewOverlay"></div>
      </div>
      <div class="action-buttons">
        <button class="action-btn" id="btnZoom" onclick="event.stopPropagation();zoomImage()" disabled>放大</button>
        <button class="action-btn" id="btnReset" onclick="event.stopPropagation();resetImage()" disabled>重置</button>
        <button class="action-btn" id="btnDownload" onclick="event.stopPropagation();downloadImage()" disabled>下载</button>
      </div>
    </div>

    <!-- Model Info -->
    <div class="info-card">
      <div class="info-row">
        <span class="info-label">VLM 模型</span>
        <span class="info-value" style="font-size:11px">Qwen3-VL-32B</span>
      </div>
      <div class="info-row">
        <span class="info-label">知识库文档</span>
        <span class="info-value" id="kbCount">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">服务状态</span>
        <span class="info-value" id="serviceStatus">检测中...</span>
      </div>
    </div>

    <!-- Latency -->
    <div class="latency-card" id="latencyCard">
      <span class="info-label">最近请求耗时</span>
      <span class="latency-value" id="latencyValue">—</span>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Zoom Modal -->
<div class="modal" id="zoomModal" onclick="this.style.display='none'">
  <img id="zoomImg" alt="影像放大">
</div>

<script>
'use strict';

// ===== State =====
let currentImage = null;          // File object
let currentTab = 'vqa';
let isLoading = false;
let sessionId = 'sess-' + Math.random().toString(36).substring(2, 10);

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  renderTabState();
});

// ===== Health Check =====
async function checkHealth() {
  const dot = document.getElementById('healthDot');
  const status = document.getElementById('serviceStatus');
  const kb = document.getElementById('kbCount');
  try {
    const r = await fetch('/health', {signal: AbortSignal.timeout(5000)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    dot.className = 'health-dot ok';
    status.textContent = '正常';
    status.style.color = '#10B981';
    kb.textContent = d.kb_docs ? d.kb_docs + ' 条' : '0 条';
  } catch {
    dot.className = 'health-dot err';
    status.textContent = '离线';
    status.style.color = '#EF4444';
    kb.textContent = '—';
  }
}

// ===== Drag & Drop =====
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.add('dragover');
}
function handleDragLeave(e) {
  document.getElementById('uploadZone').classList.remove('dragover');
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) processFile(f);
}
function handleFileInput(input) {
  if (input.files[0]) processFile(input.files[0]);
}

// ===== File Processing =====
function processFile(file) {
  const allowed = ['image/jpeg', 'image/jpg', 'image/png'];
  if (!allowed.includes(file.type.toLowerCase())) {
    showToast('请上传 JPEG 或 PNG 格式的图片', 'error');
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    showToast('图片不能超过 20MB', 'error');
    return;
  }

  currentImage = file;

  // Preview
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('previewImg');
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('previewPlaceholder').style.display = 'none';
    document.getElementById('previewOverlay').style.display = 'block';
    document.getElementById('zoomImg').src = e.target.result;
  };
  reader.readAsDataURL(file);

  // Show info bar
  document.getElementById('uploadZone').style.display = 'none';
  const info = document.getElementById('uploadInfo');
  info.style.display = 'flex';
  const name = document.getElementById('uploadFileName');
  name.textContent = file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)';

  // Enable actions
  ['btnZoom', 'btnReset', 'btnDownload'].forEach(id =>
    document.getElementById(id).disabled = false
  );

  // Reset tab-specific state
  resetTabState();
  renderTabState();
  showToast('影像加载成功，可开始分析', 'success');
}

function resetTabState() {
  // VQA
  document.getElementById('vqaHistory').innerHTML = vqaWelcomeBubble();
  // MRG
  document.getElementById('mrgReport').style.display = 'none';
  document.getElementById('mrgReport').innerHTML = '';
  document.getElementById('mrgLoading').style.display = 'none';
  document.getElementById('mrgBtn').disabled = false;
  // RAG
  document.getElementById('ragResult').style.display = 'none';
  document.getElementById('ragLoading').style.display = 'none';
  document.getElementById('ragInput').value = '';
}

function vqaWelcomeBubble() {
  return `<div class="chat-bubble">
    <div class="chat-avatar ai">🤖</div>
    <div class="chat-content">影像已加载，您可以针对影像内容提问。<br>例如：这是哪个部位的影像？有何异常发现？</div>
  </div>`;
}

// ===== Reset =====
function resetImage() {
  currentImage = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadZone').style.display = 'flex';
  document.getElementById('uploadInfo').style.display = 'none';
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('previewImg').src = '';
  document.getElementById('previewPlaceholder').style.display = 'flex';
  document.getElementById('previewOverlay').style.display = 'none';
  document.getElementById('zoomImg').src = '';
  ['btnZoom', 'btnReset', 'btnDownload'].forEach(id =>
    document.getElementById(id).disabled = true
  );
  resetTabState();
  renderTabState();
}

// ===== Tab Switching =====
function switchTab(tab) {
  currentTab = tab;
  ['vqa', 'mrg', 'rag'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  renderTabState();
}

function renderTabState() {
  const panels = ['vqa', 'mrg', 'rag'];
  const empty = document.getElementById('emptyState');

  if (!currentImage) {
    panels.forEach(t => {
      const p = document.getElementById('panel-' + t);
      p.style.display = 'none';
      p.classList.remove('active');
    });
    empty.style.display = 'flex';
  } else {
    empty.style.display = 'none';
    panels.forEach(t => {
      const p = document.getElementById('panel-' + t);
      const isActive = t === currentTab;
      p.style.display = isActive ? 'flex' : 'none';
      p.classList.toggle('active', isActive);
    });
  }
}

// ===== API Call =====
async function callAnalyze(task, query) {
  if (!currentImage) { showToast('请先上传影像文件', 'error'); return null; }
  if (isLoading) return null;

  isLoading = true;
  const fd = new FormData();
  fd.append('task', task);
  fd.append('image', currentImage, currentImage.name);
  if (query && query.trim()) fd.append('query', query.trim());
  fd.append('session_id', sessionId);

  try {
    const r = await fetch('/api/analyze', {method: 'POST', body: fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'HTTP ' + r.status);

    // Update latency display
    if (d.latency_ms != null) {
      const card = document.getElementById('latencyCard');
      card.style.display = 'flex';
      document.getElementById('latencyValue').textContent = d.latency_ms.toLocaleString() + ' ms';
    }
    return d;
  } catch (e) {
    showToast(e.message || '请求失败，请重试', 'error');
    return null;
  } finally {
    isLoading = false;
  }
}

// ===== VQA =====
async function sendVQA() {
  const input = document.getElementById('vqaInput');
  const query = input.value.trim();
  if (!query) { showToast('请输入问题', 'error'); return; }
  if (!currentImage) { showToast('请先上传影像', 'error'); return; }
  if (isLoading) return;

  input.value = '';
  setVQADisabled(true);
  appendChatBubble('user', query);
  const loadingId = appendLoadingBubble();

  const data = await callAnalyze('vqa', query);

  removeBubble(loadingId);
  setVQADisabled(false);

  if (data) appendChatBubble('ai', data.answer || '（无内容）');
  input.focus();
}

function setVQADisabled(d) {
  document.getElementById('vqaInput').disabled = d;
  document.getElementById('vqaSend').disabled = d;
}

function appendChatBubble(role, content) {
  const history = document.getElementById('vqaHistory');
  const div = document.createElement('div');
  div.className = 'chat-bubble' + (role === 'user' ? ' user' : '');
  if (role === 'ai') {
    div.innerHTML = `<div class="chat-avatar ai">🤖</div>
      <div class="chat-content">${escHtml(content).replace(/\n/g, '<br>')}</div>`;
  } else {
    div.innerHTML = `<div class="chat-content user">${escHtml(content)}</div>
      <div class="chat-avatar user-av">👤</div>`;
  }
  history.appendChild(div);
  history.scrollTop = history.scrollHeight;
}

function appendLoadingBubble() {
  const id = 'load-' + Date.now();
  const history = document.getElementById('vqaHistory');
  const div = document.createElement('div');
  div.id = id;
  div.className = 'chat-bubble';
  div.innerHTML = `<div class="chat-avatar ai">🤖</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>`;
  history.appendChild(div);
  history.scrollTop = history.scrollHeight;
  return id;
}

function removeBubble(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ===== MRG =====
async function generateMRG() {
  if (!currentImage) { showToast('请先上传影像', 'error'); return; }
  if (isLoading) return;

  const btn = document.getElementById('mrgBtn');
  const loading = document.getElementById('mrgLoading');
  const reportEl = document.getElementById('mrgReport');

  btn.disabled = true;
  loading.style.display = 'flex';
  reportEl.style.display = 'none';

  const data = await callAnalyze('mrg', '');

  loading.style.display = 'none';
  btn.disabled = false;

  if (data) {
    renderMRGReport(data);
    reportEl.style.display = 'block';
  }
}

function renderMRGReport(data) {
  const r = data.report || {};
  const modelShort = (data.model || '').split('/').pop() || 'VLM';
  const el = document.getElementById('mrgReport');

  const sections = [
    {key: 'chief_complaint', label: '主诉 / 检查目的'},
    {key: 'findings', label: '影像所见'},
    {key: 'impression', label: '印象'},
    {key: 'recommendation', label: '建议'},
  ];

  let sectionsHtml = sections
    .filter(s => r[s.key])
    .map(s => `<div class="report-section">
      <div class="report-label">${s.label}</div>
      <div class="report-value">${escHtml(r[s.key]).replace(/\n/g, '<br>')}</div>
    </div>`)
    .join('');

  // Fallback: if structured fields are empty, show raw answer text
  if (!sectionsHtml && data.answer) {
    sectionsHtml = `<div class="report-section">
      <div class="report-value">${escHtml(data.answer).replace(/\n/g, '<br>')}</div>
    </div>`;
  }

  el.innerHTML = `
    <div class="report-card">
      <div class="report-title">AI 影像分析报告</div>
      <div class="report-tags">
        <span class="tag tag-warn">AI 辅助分析</span>
        <span class="tag tag-muted">${escHtml(modelShort)}</span>
      </div>
      ${sectionsHtml}
      <div class="report-disclaimer">⚠️ ${escHtml(data.disclaimer || '本系统仅供参考，不构成医疗诊断建议，请遵医嘱')}</div>
    </div>`;
}

// ===== RAG =====
async function sendRAG() {
  const input = document.getElementById('ragInput');
  const query = input.value.trim();
  if (!query) { showToast('请输入检索问题', 'error'); return; }
  if (!currentImage) { showToast('请先上传影像', 'error'); return; }
  if (isLoading) return;

  const loading = document.getElementById('ragLoading');
  const result = document.getElementById('ragResult');
  const btn = document.getElementById('ragBtn');

  btn.disabled = true;
  loading.style.display = 'flex';
  result.style.display = 'none';

  const data = await callAnalyze('rag', query);

  loading.style.display = 'none';
  btn.disabled = false;

  if (data) {
    renderRAGResult(data);
    result.style.display = 'block';
  }
}

function renderRAGResult(data) {
  const answer = data.answer || '（无回答）';
  document.getElementById('ragAnswer').innerHTML =
    escHtml(answer).replace(/\n/g, '<br>');

  const refs = data.references || [];
  const refsEl = document.getElementById('ragRefs');

  if (refs.length > 0) {
    refsEl.innerHTML = `<div class="refs-title">参考文献 (${refs.length} 条命中)</div>` +
      refs.map((ref, i) => {
        const score = Math.round((ref.score || 0) * 100);
        const title = ref.title ? `<span class="ref-title-text">${escHtml(ref.title)}</span>` : '';
        return `<div class="ref-item">
          <div class="ref-header">
            <span class="ref-num">[文档 ${i + 1}]</span>
            ${title}
            <span class="ref-score">相似度 ${score}%</span>
          </div>
          <div class="ref-snippet">${escHtml(ref.snippet || '')}</div>
        </div>`;
      }).join('');
  } else {
    refsEl.innerHTML = '<div class="no-refs">知识库无相关命中，答案基于影像直接生成</div>';
  }
}

// ===== Zoom =====
function zoomImage() {
  if (!currentImage) return;
  const src = document.getElementById('previewImg').src;
  if (!src) return;
  document.getElementById('zoomImg').src = src;
  document.getElementById('zoomModal').style.display = 'flex';
}

// ===== Download =====
function downloadImage() {
  if (!currentImage) return;
  const src = document.getElementById('previewImg').src;
  if (!src) return;
  const a = document.createElement('a');
  a.href = src;
  a.download = currentImage.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ===== Toast =====
let _toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '') + ' show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== Utils =====
function escHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
