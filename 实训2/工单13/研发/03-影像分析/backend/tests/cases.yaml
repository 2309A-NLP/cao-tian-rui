# ============================================================
# RAG 正常 case（6例）
# ============================================================
rag_cases:
  - id: RAG_01_base
    image: chest_xray_01.jpg
    query: "肺结节的临床意义是什么？"
    task: rag
    expected_references_count_min: 1

  - id: RAG_01_var1
    image: chest_xray_01.jpg
    query: "这个发现的临床意义是什么？"
    task: rag
    expected_references_count_min: 0   # 宽松，允许无文献但不崩溃

  - id: RAG_02_base
    image: ct_tumor_01.jpg
    query: "影像学发现肿块时如何评估良恶性？"
