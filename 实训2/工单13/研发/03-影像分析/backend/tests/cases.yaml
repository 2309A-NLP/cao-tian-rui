    task: rag
    expected_references_count_min: 0

# ============================================================
# 边界 / 异常 case（18例）
# ============================================================
boundary_cases:
  # --- 图片边界（6例）---
  - id: BOUND_IMG_01
    image: normal_photo.jpg
    query: "这张影像有什么异常？"
    task: vqa
    expected_status: 200
    expected_behavior: no_crash

  - id: BOUND_IMG_02
    image: black.jpg
    query: "这张影像有什么发现？"
    task: vqa
    expected_status: 200
    expected_behavior: no_crash

  - id: BOUND_IMG_03
    image: tiny.jpg
    task: mrg
    expected_status: 422
    expected_error_code: IMAGE_INVALID

  - id: BOUND_IMG_04
    generate: large_dummy_21mb
    task: vqa
    expected_status: 413
    expected_error_code: IMAGE_TOO_LARGE

  - id: BOUND_IMG_05
    generate: fake_pdf
    task: vqa
    expected_status: 415
    expected_error_code: UNSUPPORTED_FORMAT

  - id: BOUND_IMG_06
    no_image: true
    task: vqa
    expected_status: 422    # FastAPI 422 for missing required field
    expected_behavior: error_response

  # --- 文本边界（5例）---
  - id: BOUND_TXT_01
    image: chest_xray_01.jpg
    query: ""
    task: vqa
    expected_status: 400
    expected_error_code: MISSING_QUERY

  - id: BOUND_TXT_02
    image: chest_xray_01.jpg
    query: "今天天气怎么样？"
    task: vqa
    expected_status: 200
    expected_behavior: no_crash

  - id: BOUND_TXT_03
    image: chest_xray_01.jpg
    query: "<script>alert('xss')</script>"
    task: vqa
    expected_status: 200
    expected_behavior: no_crash

  - id: BOUND_TXT_04
    image: chest_xray_01.jpg
    query_repeat: ["这", 600]   # "这" × 600
    task: vqa
    expected_status: 200
    expected_behavior: no_crash

  - id: BOUND_TXT_05
    image: chest_xray_01.jpg
    task: invalid_task_xxx
    expected_status: 422

  # --- 任务路由（3例）---
  - id: BOUND_ROUTE_01
    image: chest_xray_01.jpg
    query: "影像发现？"
    task: vqa
    expected_status: 200
    expected_task_in_response: vqa

  - id: BOUND_ROUTE_02
    image: chest_xray_01.jpg
    task: mrg
    expected_status: 200
    expected_task_in_response: mrg

  - id: BOUND_ROUTE_03
    image: chest_xray_01.jpg
    query: "影像发现？"
    task: rag
    expected_status: 200
    expected_task_in_response: rag

  # --- 预留 CV 任务返回 501（3例）---
  - id: BOUND_CV_01
    image: chest_xray_01.jpg
    task: classification
    expected_status: 501

  - id: BOUND_CV_02
    image: chest_xray_01.jpg
    task: detection
    expected_status: 501

  - id: BOUND_CV_03
    image: chest_xray_01.jpg
    task: segmentation
    expected_status: 501

  # --- Session 边界（1例）---
  - id: BOUND_SES_01
    image: chest_xray_01.jpg
    query: "这张影像有什么发现？"
    task: vqa
    session_id: "non_existent_session_12345"
    expected_status: 200
    expected_behavior: no_crash
