# 工单编号：人工智能NLP-Agent数字人项目-医疗智能体-影像分析
# 全量测试用例（42例：VQA×12 + MRG×6 + RAG×6 + 边界×18）

# ============================================================
# VQA 正常 case（12例）
# ============================================================
vqa_cases:
  - id: VQA_01_base
    image: xray_lung_01.jpg
    query: "这张影像使用的是什么成像方式？"
    expected_keywords_any: ["X光", "X线", "X射线", "X-ray", "胸片", "放射", "radiograph", "chest", "平片", "摄片", "透视", "普通", "肺", "lung"]
    task: vqa

  - id: VQA_01_var1
    image: chest_xray_02.jpg
    query: "What imaging modality is used for this medical image?"
    expected_keywords_any: ["X-ray", "X线", "chest", "radiograph", "X光", "胸片", "plain film"]
    task: vqa

  - id: VQA_02_base
    image: pathology_01.jpg
    query: "图像中有多少个细胞？请找出并计数"
    expected_keywords_any: ["个", "细胞", "count", "cells", "数", "numerous", "many", "多", "大量", "密集"]
    task: vqa

  - id: VQA_02_var1
    image: pathology_01.jpg
    query: "Can you find and count how many cells are in this image?"
    expected_keywords_any: ["cells", "numerous", "many", "count", "individual", "细胞", "多"]
    task: vqa

  - id: VQA_03_base
    image: chest_xray_01.jpg
    query: "这张X光片是否显示心脏肥大的迹象？请分析"
    expected_keywords_any: ["是", "否", "心脏", "增大", "cardiomegaly", "heart", "no", "yes"]
    task: vqa

  - id: VQA_03_var1
    image: chest_xray_02.jpg
    query: "Does this X-ray image show a sign of Cardiomegaly? Find the answer."
    expected_keywords_any: ["yes", "no", "heart", "cardiomegaly", "cardiac"]
    task: vqa

  - id: VQA_04_base
    image: ct_tumor_01.jpg
    query: "图像中是否存在肿瘤？请指出位置"
    expected_keywords_any: ["是", "否", "肿瘤", "结节", "tumor", "nodule", "mass", "no", "yes"]
    task: vqa

  - id: VQA_04_var1
    image: ct_tumor_01.jpg
    query: "Find if there is a tumor in this image."
    expected_keywords_any: ["tumor", "nodule", "mass", "yes", "no", "lesion"]
    task: vqa

  - id: VQA_05_base
    image: xray_lung_02.jpg
    query: "这张影像的整体质量评估如何？"
    expected_keywords_any: ["清晰", "模糊", "质量", "曝光", "quality", "adequate", "良好", "可", "满足", "分辨"]
    task: vqa

  - id: VQA_05_var1
    image: chest_xray_02.jpg
    query: "请描述这张影像的主要影像学表现"
    expected_keywords_any: ["肺", "胸", "影像", "显示", "可见", "lung", "chest"]
    task: vqa

  - id: VQA_06_base
    image: pathology_01.jpg
    query: "这张病理图像最可能的诊断是什么？"
    expected_keywords_any: ["组织", "细胞", "病变", "诊断", "分析", "tissue", "cell"]
    task: vqa

  - id: VQA_06_var1
    image: ct_tumor_01.jpg
    query: "影像中异常区域的密度特征是什么？"
    expected_keywords_any: ["密度", "低密度", "高密度", "均匀", "不均匀", "density", "hypodense", "hyperdense"]
    task: vqa

  - id: VQA_07_mri
    image: mri_abdomen_01.jpg
    query: "这是什么部位的MRI影像？"
    expected_keywords_any: ["腹", "腹部", "abdomen", "MRI", "磁共振", "liver", "肝"]
    task: vqa

  - id: VQA_08_mri
    image: mri_abdomen_03.jpg
    query: "MRI影像中可以看到哪些器官结构？"
    expected_keywords_any: ["器官", "结构", "organ", "腹", "肝", "肾", "脾"]
    task: vqa

  - id: VQA_09_xray
    image: xray_lung_01.jpg
    query: "这张X光片的肺野表现如何？"
    expected_keywords_any: ["肺", "肺野", "lung", "清晰", "透亮", "渗出", "实变"]
    task: vqa

  - id: VQA_10_xray
    image: xray_lung_03.jpg
    query: "请判断这张胸片是否有异常"
    expected_keywords_any: ["异常", "正常", "normal", "abnormal", "发现", "未见"]
    task: vqa

  - id: VQA_11_ct
    image: ct_lung_01.jpg
    query: "CT影像中肺部有何发现？"
    expected_keywords_any: ["肺", "结节", "肿块", "lung", "nodule", "mass", "未见", "正常"]
    task: vqa

  - id: VQA_12_ct
    image: ct_abdomen_03.jpg
    query: "这张腹部CT显示了哪些结构？"
    expected_keywords_any: ["腹", "肝", "肾", "胃", "abdomen", "liver", "kidney"]
    task: vqa

