<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程提醒助手 · 小暖</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #fff5f5; height:100vh; display:flex; flex-direction:column;
}
header {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: #fff; padding: 12px 24px; display:flex; align-items:center;
  justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
header h1 { font-size: 18px; font-weight: 600; }
header .sub { font-size: 12px; opacity: .85; }
.status { font-size:11px; padding:2px 10px; border-radius:10px; background:rgba(255,255,255,.2); }
.status.ok { background:#4caf50; }
.status.err { background:#f44336; }

/* 提醒横幅 */
#reminder-banner {
  display:none; margin:0 20px; padding:12px 20px; background:linear-gradient(135deg,#fff9c4,#fff176);
  border:2px solid #ffc107; border-radius:12px; text-align:center; font-size:15px; animation:slideDown .4s ease;
  position:sticky; top:0; z-index:10; box-shadow:0 2px 12px rgba(255,193,7,.3);
}
@keyframes slideDown { from{transform:translateY(-100%);opacity:0} to{transform:translateY(0);opacity:1} }
#reminder-banner .close-banner { float:right; cursor:pointer; font-size:18px; color:#999; border:none; background:none; }

/* 聊天区 */
#chat-container {
  flex:1; overflow-y:auto; padding: 20px; display:flex; flex-direction:column; gap:12px;
}
.msg { max-width:85%; padding:10px 16px; border-radius:14px; line-height:1.6; font-size:15px; word-break:break-word; white-space:pre-wrap; }
.msg.user { align-self:flex-end; background:linear-gradient(135deg,#f5576c,#f093fb); color:#fff; border-bottom-right-radius:4px; }
.msg.assistant { align-self:flex-start; background:#fff; color:#333; border-bottom-left-radius:4px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
.msg.system { align-self:center; background:#f5f5f5; color:#999; font-size:12px; max-width:95%; border-radius:6px; padding:6px 12px; }
.msg.tool { align-self:center; background:#fff3e0; color:#e65100; font-size:12px; max-width:90%; border-radius:6px; padding:6px 12px; border:1px dashed #ffcc80; }
.msg.reminder { align-self:center; background:linear-gradient(135deg,#fff9c4,#ffe082); color:#f57f17; font-size:14px; max-width:90%; border-radius:14px; padding:12px 18px; border:2px solid #ffc107; animation:pulse 2s ease infinite; font-weight:600; text-align:center; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,.4)} 50%{box-shadow:0 0 0 8px rgba(255,193,7,0)} }

/* 输入区 */
#input-area {
  padding:16px 20px; background:#fff; border-top:1px solid #fce4ec; display:flex; gap:10px;
}
#input-area input {
  flex:1; padding:10px 16px; border:2px solid #f8bbd0; border-radius:24px; font-size:15px;
  outline:none; transition:border-color .2s;
}
#input-area input:focus { border-color:#f5576c; }
#input-area button {
  padding:10px 24px; border:none; border-radius:24px; background:linear-gradient(135deg,#f5576c,#f093fb); color:#fff;
  font-size:15px; cursor:pointer; transition:opacity .2s; font-weight:600;
}
#input-area button:hover { opacity:.9; }
#input-area button:disabled { opacity:.5; cursor:not-allowed; }

/* 快捷测试 */
#quick-tests {
  padding:8px 20px; background:#fffafc; border-top:1px solid #fce4ec; display:flex;
  gap:8px; overflow-x:auto; flex-wrap:wrap;
}
#quick-tests button {
  padding:5px 12px; border:1px solid #f8bbd0; border-radius:14px; background:#fff;
  font-size:12px; cursor:pointer; white-space:nowrap; transition:all .2s; color:#d81b60;
}
#quick-tests button:hover { border-color:#f5576c; background:#fff5f5; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🌸 日程提醒助手 · 小暖</h1>
    <div class="sub">工单编号：人工智能 NLP-Agent 数字人项目-日程提醒智能体任务</div>
  </div>
  <div>
    <span id="status" class="status">连接中...</span>
  </div>
</header>

<div id="reminder-banner">
  <button class="close-banner" onclick="dismissBanner()">✕</button>
  <span id="reminder-text"></span>
</div>

<div id="chat-container"></div>

<div id="quick-tests">
  <span style="font-size:12px;color:#999;line-height:28px;">快捷测试：</span>
  <button onclick="sendMsg('添加日程：下午5点开会')">添加日程</button>
  <button onclick="sendMsg('我今天的日程有哪些？')">查看日程</button>
  <button onclick="sendMsg('明天上午8点提醒我买咖啡')">明天日程</button>
  <button onclick="sendMsg('删除日程1')">删除日程</button>
  <button onclick="sendMsg('每个工作日早上9点站会')">循环日程</button>
  <button onclick="sendMsg('15:15 提醒我买咖啡')">验收测试</button>
</div>

<div id="input-area">
  <input id="msgInput" placeholder='跟我说吧，比如："添加日程：下午5点开会"、"我今天的日程有哪些？"'
         onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="sendBtn" onclick="sendMsg()">发送</button>
</div>

<script>
const API = '/api/chat/stream';
const REMINDER_API = '/api/reminders/pending';
const SESSION_KEY = 'schedule_session_id';
let sessionId = localStorage.getItem(SESSION_KEY) || '';
let isProcessing = false;
let reminderTimer = null;

const TOOL_NAMES = {
  add_schedule: '📝 正在添加日程...',
  query_schedules: '🔍 正在查询日程...',
  update_schedule: '✏️ 正在修改日程...',
  delete_schedule: '🗑️ 正在处理删除...'
};

function addMsg(role, text, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (meta) div.innerHTML = `<div class="meta">${meta}</div>${text}`;
  else div.textContent = text;
  document.getElementById('chat-container').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return div;
}

async function sendMsg(text) {
  if (isProcessing) return;
  const input = document.getElementById('msgInput');
  const msg = text || input.value.trim();
  if (!msg) return;
  input.value = '';
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('status').textContent = '思考中...';
  document.getElementById('status').className = 'status';

  addMsg('user', msg);

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let streamDiv = null;
    let fullReply = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));
          switch (event.type) {
            case 'token':
              if (!streamDiv) streamDiv = addMsg('assistant', '');
              fullReply += event.content;
              streamDiv.textContent = fullReply;
              streamDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
              break;
            case 'tool_call':
              addMsg('tool', TOOL_NAMES[event.name] || `调用 ${event.name}`);
              break;
            case 'tool_result':
              break;
            case 'done':
              sessionId = event.session_id;
              localStorage.setItem(SESSION_KEY, sessionId);
              if (streamDiv) {
                streamDiv.textContent = fullReply;
              }
              break;
          }
        } catch(e) { console.error('SSE parse error:', e); }
      }
    }
    document.getElementById('status').textContent = '就绪';
    document.getElementById('status').className = 'status ok';
  } catch(e) {
    addMsg('system', '请求失败: ' + e.message + '\n请确认后端服务已启动（python run.py）');
    document.getElementById('status').textContent = '错误';
    document.getElementById('status').className = 'status err';
  }
  isProcessing = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

// ═══════════════════════════════════════════
//  提醒轮询（每15秒检查一次新提醒）
// ═══════════════════════════════════════════

async function pollReminders() {
  try {
    const resp = await fetch(REMINDER_API);
    const data = await resp.json();
    if (data.reminders && data.reminders.length > 0) {
      for (const r of data.reminders) {
        // 聊天区显示提醒
        addMsg('reminder', '🔔 ' + r.message);
        // 顶部横幅
        showBanner(r.message);
        // 浏览器桌面通知（如果授权了）
        if (Notification.permission === 'granted') {
          new Notification('日程提醒 · 小暖', {
            body: r.message,
            icon: '🌸',
            tag: 'schedule-reminder'
          });
        }
      }
    }
  } catch(e) {
    // 静默失败，不影响聊天
  }
}

function showBanner(text) {
  document.getElementById('reminder-text').textContent = text;
  document.getElementById('reminder-banner').style.display = 'block';
  // 8秒后自动消失
  setTimeout(dismissBanner, 8000);
}

function dismissBanner() {
  document.getElementById('reminder-banner').style.display = 'none';
}

// ═══════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════

// 请求桌面通知权限
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

// 获取开场白
fetch('/api/welcome')
  .then(r => r.json())
  .then(d => {
    sessionId = d.session_id;
    localStorage.setItem(SESSION_KEY, sessionId);
    addMsg('assistant', d.reply);
    document.getElementById('status').textContent = '就绪';
    document.getElementById('status').className = 'status ok';
  })
  .catch(() => {
    addMsg('system', '连接后端服务失败，请确认已执行 python run.py');
    document.getElementById('status').textContent = '连接失败';
    document.getElementById('status').className = 'status err';
  });

// 启动提醒轮询
reminderTimer = setInterval(pollReminders, 15000);
// 首次也查一下（可能页面关闭期间有漏掉的）
setTimeout(pollReminders, 3000);

document.getElementById('msgInput').focus();
</script>
</body>
</html>
