<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent22 · mem0 智能记忆中台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #1c2129;
  --border:    #21262d;
  --border2:   #30363d;
  --text:      #e6edf3;
  --text-muted:#8b949e;
  --text-dim:  #484f58;
  --online:    #3fb950;
  --warn:      #e3b341;
  /* 各 domain 的主色由 JS 动态覆盖 */
  --active:        #00e5cc;
  --active-bg:     rgba(0,229,204,.08);
  --active-border: rgba(0,229,204,.25);
  --font-ui:  -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono:'Cascadia Code','Consolas','Courier New', monospace;
  --r: 6px; --rl: 10px;
}

html, body { width:100%; height:100%; background:var(--bg); overflow:hidden; }

#app {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  color:var(--text); font-family:var(--font-ui);
  font-size:13px; line-height:1.5; background:var(--bg);
}

/* ── Header ── */
header {
  display:flex; align-items:center; gap:16px;
  padding:0 18px; height:46px;
  border-bottom:1px solid var(--border);
  background:var(--surface); flex-shrink:0; z-index:10;
}
.logo {
  display:flex; align-items:center; gap:7px;
  font-family:var(--font-mono); font-size:13.5px; font-weight:500;
  color:var(--active); letter-spacing:.04em; white-space:nowrap;
  transition: color .3s;
}
.logo-sub { font-family:var(--font-ui); font-size:11px; color:var(--text-dim); font-weight:400; letter-spacing:0; }
.logo-sep { width:1px; height:16px; background:var(--border2); margin:0 2px; }

.tabs { display:flex; gap:3px; flex:1; justify-content:center; }
.tab {
  padding:4px 14px; border-radius:var(--r);
  border:1px solid transparent; cursor:pointer;
  font-size:12px; font-weight:500; color:var(--text-muted);
  background:transparent; transition:all .15s;
  display:flex; align-items:center; gap:5px;
}
.tab:hover { background:rgba(255,255,255,.04); color:var(--text); }
.tab.active { background:var(--active-bg); border-color:var(--active-border); color:var(--active); }
.tab-dot { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.7; }

.status-group { display:flex; align-items:center; gap:12px; margin-left:auto; }
.status-item { display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--text-dim); font-family:var(--font-mono); }
.dot { width:6px; height:6px; border-radius:50%; background:var(--online); box-shadow:0 0 5px var(--online); animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Main ── */
.main { display:flex; flex:1; overflow:hidden; min-height:0; }
.panel { display:flex; flex-direction:column; border-right:1px solid var(--border); overflow:hidden; min-height:0; }
.panel:last-child { border-right:none; }
.panel-left  { flex:0 0 42%; }
.panel-mid   { flex:0 0 28%; }
.panel-right { flex:1; }

.panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 14px; border-bottom:1px solid var(--border);
  background:var(--surface); flex-shrink:0;
}
.panel-title {
  font-size:10.5px; font-weight:600; color:var(--text-muted);
  text-transform:uppercase; letter-spacing:.08em;
  display:flex; align-items:center; gap:5px;
}
.pticon { color:var(--active); transition:color .3s; }

/* ── Session switcher ── */
.session-sw { display:flex; gap:3px; }
.sbtn {
  padding:3px 9px; border-radius:var(--r);
  border:1px solid var(--border2); background:transparent;
  color:var(--text-muted); font-size:11px; cursor:pointer;
  font-family:var(--font-mono); transition:all .14s;
}
.sbtn.active { border-color:var(--active-border); background:var(--active-bg); color:var(--active); }

/* ── User ID 行 ── */
.uid-row {
  display:flex; align-items:center; gap:6px;
  padding:6px 14px; border-bottom:1px solid var(--border);
  background:var(--surface); flex-shrink:0;
}
.uid-row label { font-size:10px; color:var(--text-dim); font-family:var(--font-mono); white-space:nowrap; }
.uid-input {
  flex:1; background:var(--bg); border:1px solid var(--border2);
  border-radius:var(--r); padding:3px 8px; color:var(--text);
  font-family:var(--font-mono); font-size:11px; outline:none; transition:border-color .14s;
}
.uid-input:focus { border-color:var(--active-border); }
.clear-btn {
  padding:3px 9px; border-radius:var(--r);
  border:1px solid rgba(255,80,80,.3); background:rgba(255,80,80,.08);
  color:#ff6b6b; font-size:10.5px; cursor:pointer; font-family:var(--font-mono);
  transition:all .14s; white-space:nowrap;
}
.clear-btn:hover { background:rgba(255,80,80,.16); }

/* ── Chat body ── */
.chat-body {
  flex:1; overflow-y:auto; padding:14px;
  display:flex; flex-direction:column; gap:10px; min-height:0;
}
.chat-body::-webkit-scrollbar { width:3px; }
.chat-body::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

.bubble-row { display:flex; gap:7px; animation:fadeUp .22s ease both; }
.bubble-row.user { flex-direction:row-reverse; }
@keyframes fadeUp { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }

.av {
  width:24px; height:24px; border-radius:50%;
  background:var(--surface2); border:1px solid var(--border2);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; flex-shrink:0; color:var(--active);
  font-family:var(--font-mono); transition:color .3s;
}
.bubble-row.user .av { color:var(--text-muted); }
.bubble {
  max-width:82%; padding:8px 11px;
  font-size:12.5px; line-height:1.6;
}
.bubble.agent {
  background:var(--surface2); border:1px solid var(--border);
  border-left:2px solid var(--active);
  border-radius:2px var(--rl) var(--rl) var(--rl); color:var(--text);
  transition: border-left-color .3s;
}
.bubble.user {
  background:rgba(255,255,255,.04); border:1px solid var(--border2);
  border-radius:var(--rl) 2px var(--rl) var(--rl); color:var(--text);
}
.bubble.thinking {
  display:flex; align-items:center; gap:6px;
  color:var(--text-muted); font-size:11px; padding:7px 11px;
}
.think-lbl { font-family:var(--font-mono); }
.dots { display:flex; gap:3px; }
.dots span { width:4px; height:4px; background:var(--active); border-radius:50%; animation:blink 1.2s ease-in-out infinite; transition:background .3s; }
.dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

/* ── Quick prompts ── */
.quick-prompts {
  display:flex; flex-wrap:wrap; gap:5px;
  padding:8px 14px; border-top:1px solid var(--border); background:var(--surface);
}
.qp {
  padding:3px 9px; border-radius:20px; border:1px solid var(--border2);
  font-size:11px; color:var(--text-muted); cursor:pointer; transition:all .14s; white-space:nowrap;
}
.qp:hover { border-color:var(--active-border); color:var(--active); background:var(--active-bg); }

/* ── Input ── */
.chat-input-wrap {
  padding:9px 14px; border-top:1px solid var(--border);
  background:var(--surface); display:flex; gap:7px; align-items:flex-end;
}
.chat-input {
  flex:1; background:var(--bg); border:1px solid var(--border2);
  border-radius:var(--r); padding:7px 11px; color:var(--text);
  font-family:var(--font-ui); font-size:12.5px; resize:none; outline:none;
  min-height:34px; max-height:90px; transition:border-color .14s;
}
.chat-input:focus { border-color:var(--active-border); }
.chat-input::placeholder { color:var(--text-dim); }
.send-btn {
  width:32px; height:32px; border-radius:var(--r);
  border:1px solid var(--active-border); background:var(--active-bg);
  color:var(--active); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; transition:all .14s; flex-shrink:0;
}
.send-btn:hover { background:rgba(0,229,204,.16); }
.send-btn:disabled { opacity:.35; cursor:not-allowed; }

/* ── Recall 面板 ── */
.recall-body {
  flex:1; overflow-y:auto; padding:10px;
  display:flex; flex-direction:column; gap:7px; min-height:0;
}
.recall-body::-webkit-scrollbar { width:3px; }
.recall-body::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.recall-lat { font-family:var(--font-mono); font-size:11px; color:var(--online); }
.recall-empty {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:9px; color:var(--text-dim);
}
.recall-empty-icon {
  width:44px; height:44px; border-radius:50%;
  border:1.5px dashed var(--border2);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; opacity:.5;
}
.recall-empty p { font-size:11px; text-align:center; line-height:1.6; }
.recall-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r); padding:9px 11px;
  display:flex; flex-direction:column; gap:6px;
  animation:slideIn .2s ease both; position:relative; overflow:hidden;
}
.recall-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0;
  width:2px; background:var(--active); transition:background .3s;
}
@keyframes slideIn { from{opacity:0;transform:translateY(9px)} to{opacity:1;transform:none} }
.rc-head { display:flex; align-items:center; justify-content:space-between; gap:7px; }
.rc-idx {
  font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
  background:var(--surface); padding:1px 5px; border-radius:4px;
  border:1px solid var(--border); flex-shrink:0;
}
.rc-badge {
  font-size:10px; padding:1px 5px; border-radius:4px;
  background:rgba(240,165,0,.1); color:var(--warn);
  border:1px solid rgba(240,165,0,.22); flex-shrink:0;
}
.rc-text {
  font-size:11.5px; color:var(--text); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.score-row { display:flex; align-items:center; gap:7px; }
.score-wrap { flex:1; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.score-bar { height:100%; background:var(--active); border-radius:2px; transition:width .55s cubic-bezier(.4,0,.2,1), background .3s; width:0%; }
.score-val { font-family:var(--font-mono); font-size:10px; color:var(--active); width:30px; text-align:right; flex-shrink:0; transition:color .3s; }

/* ── Memory Bank ── */
.mb-body {
  flex:1; overflow-y:auto; padding:10px;
  display:flex; flex-direction:column; gap:5px; min-height:0;
}
.mb-body::-webkit-scrollbar { width:3px; }
.mb-body::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.mb-count {
  font-family:var(--font-mono); font-size:10px;
  background:var(--active-bg); color:var(--active);
  border:1px solid var(--active-border); padding:1px 7px; border-radius:10px;
  transition:all .3s;
}
.mem-item {
  display:flex; align-items:flex-start; gap:7px;
  padding:7px 9px; border-radius:var(--r);
  border:1px solid var(--border); background:var(--surface2);
  transition:border-color .2s, background .2s;
  animation:fadeUp .28s ease both;
}
.mem-item.fresh {
  border-color:var(--active-border); background:var(--active-bg);
  animation:newFlash 2.5s ease forwards;
}
@keyframes newFlash {
  0%   { border-color:var(--active); background:rgba(0,229,204,.14); }
  60%  { border-color:var(--active-border); background:var(--active-bg); }
  100% { border-color:var(--border); background:var(--surface2); }
}
.mem-line { width:2px; align-self:stretch; border-radius:1px; background:var(--active); flex-shrink:0; min-height:12px; transition:background .3s; }
.mem-content { flex:1; min-width:0; }
.mem-text {
  font-size:11px; color:var(--text); line-height:1.42;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all;
}
.mem-time { font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-top:2px; }
.mb-footer {
  padding:7px 12px; border-top:1px solid var(--border);
  font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
  display:flex; align-items:center; gap:7px; flex-shrink:0;
}
.fd { width:3px; height:3px; border-radius:50%; background:var(--text-dim); }

/* ── Status bar ── */
.statusbar {
  height:24px; border-top:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; padding:0 14px; gap:16px; flex-shrink:0;
}
.sb-sess { display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
.sb-node { width:6px; height:6px; border-radius:50%; border:1.5px solid var(--border2); transition:all .3s; }
.sb-node.active { border-color:var(--active); background:var(--active); box-shadow:0 0 4px var(--active); }
.sb-line { width:26px; height:1px; background:var(--border2); }
.sb-mid { flex:1; text-align:center; font-size:10px; color:var(--text-dim); font-family:var(--font-mono); }
.sb-right { display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:10px; margin-left:auto; }
.sb-metric { display:flex; align-items:center; gap:3px; }
.sb-lbl { color:var(--text-dim); }
.sb-val { color:var(--text-muted); }
.sb-val.running { color:var(--warn); animation:pulse 1.4s ease-in-out infinite; }
.sb-val.done    { color:var(--online); }

/* ── Write toast ── */
.write-toast {
  position:absolute; bottom:34px; right:14px;
  background:var(--surface); border:1px solid var(--border2); border-radius:var(--r);
  padding:7px 11px; font-size:11px; font-family:var(--font-mono);
  display:flex; align-items:center; gap:7px;
  box-shadow:0 4px 16px rgba(0,0,0,.45); z-index:200;
  opacity:0; transform:translateY(7px); transition:all .22s ease; pointer-events:none;
}
.write-toast.show { opacity:1; transform:translateY(0); }
.w-spinner {
  width:11px; height:11px; border:1.5px solid var(--border2); border-top-color:var(--active);
  border-radius:50%; animation:spin .75s linear infinite; transition:border-top-color .3s;
}
@keyframes spin { to{transform:rotate(360deg)} }
.w-done { color:var(--online); }

* { scrollbar-width:thin; scrollbar-color:var(--border2) transparent; }
</style>
</head>
<body>
<div id="app">

<!-- HEADER -->
<header>
  <div class="logo" id="logo">
    <span>◈</span> Agent22
    <div class="logo-sep"></div>
    <span class="logo-sub">mem0 智能记忆中台</span>
  </div>
  <div class="tabs">
    <button class="tab active" data-domain="medical"   onclick="switchDomain(this)"><span class="tab-dot"></span>医疗</button>
    <button class="tab"        data-domain="travel"    onclick="switchDomain(this)"><span class="tab-dot"></span>文旅</button>
    <button class="tab"        data-domain="education" onclick="switchDomain(this)"><span class="tab-dot"></span>教育</button>
  </div>
  <div class="status-group">
    <div class="status-item"><span class="dot"></span>LLM</div>
    <div class="status-item"><span class="dot"></span>Embedding</div>
    <div class="status-item"><span class="dot"></span>Chroma</div>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- LEFT：对话 -->
  <div class="panel panel-left">
    <div class="panel-header">
      <div class="panel-title"><span class="pticon">⬡</span> 对话面板</div>
      <div class="session-sw">
        <button class="sbtn active" id="s1btn" onclick="switchSession(1)">Session 1</button>
        <button class="sbtn"        id="s2btn" onclick="switchSession(2)">Session 2</button>
      </div>
    </div>
    <!-- 用户ID行 -->
    <div class="uid-row">
      <label>USER_ID</label>
      <input class="uid-input" id="uidInput" value="user001" onchange="onUidChange()" />
      <button class="clear-btn" onclick="clearMemories()">清除记忆</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="quick-prompts" id="quickPrompts"></div>
    <div class="chat-input-wrap">
      <textarea class="chat-input" id="chatInput" rows="1"
        placeholder="输入问题，Enter 发送…"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#10148;</button>
    </div>
  </div>

  <!-- MIDDLE：本轮召回 -->
  <div class="panel panel-mid">
    <div class="panel-header">
      <div class="panel-title"><span class="pticon">◎</span> 本轮召回</div>
      <span class="recall-lat" id="recallLat"></span>
    </div>
    <div class="recall-body" id="recallBody">
      <div class="recall-empty" id="recallEmpty">
        <div class="recall-empty-icon">○</div>
        <p>首次咨询<br>暂无历史记忆</p>
      </div>
    </div>
  </div>

  <!-- RIGHT：记忆库 -->
  <div class="panel panel-right">
    <div class="panel-header">
      <div class="panel-title"><span class="pticon">◇</span> 记忆库</div>
      <span class="mb-count" id="mbCount">0 条</span>
    </div>
    <div class="mb-body" id="mbBody"></div>
    <div class="mb-footer">
      <span class="fd"></span>Chroma
      <span class="fd"></span>agent22_memory
      <span class="fd"></span>1024 dim
      <span class="fd"></span>bge-large-zh-v1.5
    </div>
  </div>

</div><!-- .main -->

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="sb-sess">
    <span class="sb-node active" id="node1"></span>Session 1
    <div class="sb-line"></div>
    <span class="sb-node" id="node2"></span>Session 2
  </div>
  <div class="sb-mid" id="sbMid">准备就绪</div>
  <div class="sb-right">
    <div class="sb-metric"><span class="sb-lbl">LLM</span><span class="sb-val" id="sbLlm">—</span></div>
    <div class="sb-metric"><span class="sb-lbl">Recall</span><span class="sb-val" id="sbRecall">—</span></div>
    <div class="sb-metric"><span class="sb-lbl">后台写入</span><span class="sb-val" id="sbWrite">—</span></div>
  </div>
</div>

<!-- Write toast -->
<div class="write-toast" id="writeToast">
  <div class="w-spinner" id="wSpinner"></div>
  <span id="wText">后台写入中… (Qwen 抽取约 20s)</span>
</div>

</div><!-- #app -->

<script>
// ── 配置 ──
const API = '';

const CFG = {
  medical:   { color:'#00e5cc', bg:'rgba(0,229,204,.08)',    border:'rgba(0,229,204,.25)',    name:'医疗助手', av:'医' },
  travel:    { color:'#f0a500', bg:'rgba(240,165,0,.08)',    border:'rgba(240,165,0,.25)',    name:'文旅助手', av:'旅' },
  education: { color:'#a371f7', bg:'rgba(163,113,247,.08)', border:'rgba(163,113,247,.25)', name:'教育助手', av:'教' },
};

const PROMPTS = {
  medical:   {
    1: ['我叫王小明，血压145/95，有青霉素过敏史', '最近经常失眠，心跳偶尔偏快', '饮食和作息方面有什么建议？'],
    2: ['能给我开消炎止痛药吗，膝盖痛', '我可以用阿莫西林吗？', '请根据我的既往记录给些建议'],
  },
  travel:    {
    1: ['我叫李梅，喜欢自然风光，预算5000', '我对徒步和摄影很感兴趣', '推荐一个安静人少的地方'],
    2: ['帮我规划秋天5天旅行', '能推荐人少风景好的徒步路线吗', '住宿方面有什么性价比高的建议'],
  },
  education: {
    1: ['我叫张三，刚学Python，会了变量和循环', '列表推导式总搞不懂，能讲一下吗', '给我出两道练习题'],
    2: ['我想学函数，def怎么用', '装饰器是什么，难不难', '上次列表推导式还有点迷'],
  },
};

// ── 状态 ──
let domain  = 'medical';
let session = 1;
let busy    = false;
let userId  = 'user001';

// ── 启动 ──
function init() {
  applyTheme(domain);
  renderQuickPrompts();
  addBubble('agent', `您好！我是 ${CFG[domain].name}，有什么可以帮您？`);
  updateSbMid(0);
  fetchMemories();
}

// ── 主题切换 ──
function applyTheme(d) {
  const c = CFG[d];
  document.documentElement.style.setProperty('--active',        c.color);
  document.documentElement.style.setProperty('--active-bg',     c.bg);
  document.documentElement.style.setProperty('--active-border', c.border);
}

// ── 领域切换 ──
function switchDomain(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  domain = el.dataset.domain;
  applyTheme(domain);
  session = 1;
  document.getElementById('chatBody').innerHTML = '';
  clearRecallPanel();
  resetSB();
  updateSessionBtns();
  renderQuickPrompts();
  addBubble('agent', `您好！我是 ${CFG[domain].name}，有什么可以帮您？`);
  fetchMemories();
}

// ── Session 切换 ──
function switchSession(n) {
  session = n;
  updateSessionBtns();
  document.getElementById('chatBody').innerHTML = '';
  clearRecallPanel();
  renderQuickPrompts();
  const memCnt = parseInt(document.getElementById('mbCount').textContent) || 0;
  const msg = n === 1
    ? `Session 1 重置。我是 ${CFG[domain].name}，请继续。`
    : `Session 2 开始。记忆库共 ${memCnt} 条历史记录，本次对话将自动参考。`;
  addBubble('agent', msg);
  updateSbMid(memCnt);
}

function updateSessionBtns() {
  document.getElementById('s1btn').classList.toggle('active', session === 1);
  document.getElementById('s2btn').classList.toggle('active', session === 2);
  document.getElementById('node1').classList.toggle('active', session === 1);
  document.getElementById('node2').classList.toggle('active', session === 2);
}

// ── 用户ID变化 ──
function onUidChange() {
  userId = document.getElementById('uidInput').value.trim() || 'user001';
  fetchMemories();
}

// ── 发送消息 ──
function sendMessage() {
  if (busy) return;
  const inp = document.getElementById('chatInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; autoResize(inp);
  doSend(txt);
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

async function doSend(txt) {
  busy = true;
  document.getElementById('sendBtn').disabled = true;
  addBubble('user', txt);

  const snap_d = domain, snap_s = session, snap_uid = userId;
  const thinkId = addThinking('召回记忆中');
  setSb('sbRecall', '检索中…', 'running');
  setSb('sbLlm',    '等待中…', 'running');

  try {
    const t0 = performance.now();
    const resp = await fetch(`${API}/api/chat/${snap_d}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id:    snap_uid,
        query:      txt,
        session_id: `session${snap_s}_${snap_d}`,
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const totalMs = Math.round(performance.now() - t0);

    removeThinking(thinkId);
    addBubble('agent', data.reply, data.source);

    // 召回面板
    renderRecallPanel(data.recalled || [], data.elapsed_ms);
    setSb('sbRecall', (data.elapsed_ms || 0) + 'ms', 'done');
    setSb('sbLlm', (totalMs / 1000).toFixed(1) + 's', 'done');

    // 写入提示
    showWriteToast();
    // 25s 后拉取记忆库
    setTimeout(() => fetchMemories(), 25000);

  } catch (err) {
    removeThinking(thinkId);
    addBubble('agent', '⚠️ 请求失败，请确认后端服务已启动（http://localhost:8022）。');
    setSb('sbRecall', '失败', '');
    setSb('sbLlm',    '失败', '');
  } finally {
    busy = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// ── 记忆库拉取 ──
async function fetchMemories() {
  try {
    const resp = await fetch(`${API}/api/memory/${domain}/${encodeURIComponent(userId)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    renderMembank(data.memories || []);
  } catch (_) {}
}

// ── 清除记忆 ──
async function clearMemories() {
  if (!confirm(`清空「${CFG[domain].name}」用户「${userId}」的全部记忆？`)) return;
  try {
    const resp = await fetch(`${API}/api/memory/${domain}/${encodeURIComponent(userId)}`, { method: 'DELETE' });
    const data = await resp.json();
    alert(data.message);
    fetchMemories();
  } catch (e) { alert('清除失败：' + e.message); }
}

// ── 写入 Toast ──
function showWriteToast() {
  const toast = document.getElementById('writeToast');
  setSb('sbWrite', '写入中…', 'running');
  document.getElementById('wSpinner').style.display = '';
  document.getElementById('wText').textContent = '后台写入中… (Qwen 抽取约 20s)';
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
    setSb('sbWrite', '✓', 'done');
    fetchMemories();
  }, 25000);
}

// ── 召回面板 ──
function renderRecallPanel(list, ms) {
  const body = document.getElementById('recallBody');
  document.getElementById('recallLat').textContent = ms ? ms + 'ms' : '';

  if (!list || list.length === 0) {
    body.innerHTML = `<div class="recall-empty">
      <div class="recall-empty-icon">○</div>
      <p>首次咨询<br>暂无历史记忆</p></div>`;
    return;
  }

  body.innerHTML = '';
  const isCross = session === 2;
  list.forEach((item, i) => {
    const text  = item.memory || '';
    const score = item.score  || 0;
    const card  = document.createElement('div');
    card.className = 'recall-card';
    card.style.animationDelay = (i * 80) + 'ms';
    card.innerHTML = `
      <div class="rc-head">
        <span class="rc-idx">#${i + 1}</span>
        ${isCross ? '<span class="rc-badge">跨会话</span>' : ''}
      </div>
      <div class="rc-text">${esc(text)}</div>
      <div class="score-row">
        <div class="score-wrap"><div class="score-bar" id="bar${i}"></div></div>
        <span class="score-val">${score.toFixed(2)}</span>
      </div>`;
    body.appendChild(card);
    setTimeout(() => {
      const b = document.getElementById('bar' + i);
      if (b) b.style.width = (Math.min(score, 1) * 100) + '%';
    }, 60 + i * 100);
  });
}

function clearRecallPanel() {
  document.getElementById('recallLat').textContent = '';
  setSb('sbRecall', '—', '');
  document.getElementById('recallBody').innerHTML = `<div class="recall-empty">
    <div class="recall-empty-icon">○</div>
    <p>首次咨询<br>暂无历史记忆</p></div>`;
}

// ── 记忆库 ──
function renderMembank(list) {
  const body = document.getElementById('mbBody');
  document.getElementById('mbCount').textContent = list.length + ' 条';
  body.innerHTML = '';
  [...list].reverse().forEach((m, i) => {
    const text = m.memory || '';
    const ts   = m.metadata?.created_at ? m.metadata.created_at.slice(0, 19).replace('T', ' ') : '';
    const item = document.createElement('div');
    item.className = 'mem-item' + (i === 0 ? ' fresh' : '');
    item.style.animationDelay = (i * 40) + 'ms';
    item.innerHTML = `
      <div class="mem-line"></div>
      <div class="mem-content">
        <div class="mem-text">${esc(text)}</div>
        <div class="mem-time">${ts}</div>
      </div>`;
    body.appendChild(item);
  });
  updateSbMid(list.length);
}

// ── 气泡 ──
let thinkCnt = 0;
function addBubble(role, text, source) {
  const body = document.getElementById('chatBody');
  const row  = document.createElement('div');
  row.className = 'bubble-row ' + role;
  const av  = document.createElement('div'); av.className = 'av';
  av.textContent = role === 'agent' ? CFG[domain].av : '我';
  const bub = document.createElement('div'); bub.className = 'bubble ' + role;
  bub.innerHTML = fmt(text);
  // 来源标签：工单12 Neo4j
  if (role === 'agent' && source === 'wt12_neo4j') {
    const tag = document.createElement('div');
    tag.style.cssText = 'font-size:10px;color:var(--text-dim);margin-top:6px;font-family:var(--font-mono);';
    tag.textContent = '▸ Neo4j 知识图谱 · 工单12';
    bub.appendChild(tag);
  } else if (role === 'agent' && source === 'fallback_llm') {
    const tag = document.createElement('div');
    tag.style.cssText = 'font-size:10px;color:#e3b341;margin-top:6px;font-family:var(--font-mono);';
    tag.textContent = '▸ 工单12不可用，已切换本地LLM';
    bub.appendChild(tag);
  }
  if (role === 'agent') { row.appendChild(av); row.appendChild(bub); }
  else                  { row.appendChild(bub); row.appendChild(av); }
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
}

function addThinking(label) {
  const id   = 'think' + (++thinkCnt);
  const body = document.getElementById('chatBody');
  const row  = document.createElement('div'); row.className = 'bubble-row agent'; row.id = id;
  const av   = document.createElement('div'); av.className = 'av'; av.textContent = CFG[domain].av;
  const bub  = document.createElement('div'); bub.className = 'bubble agent thinking';
  bub.innerHTML = `<span class="think-lbl">${label}</span><div class="dots"><span></span><span></span><span></span></div>`;
  row.appendChild(av); row.appendChild(bub); body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  return id;
}
function removeThinking(id) { const el = document.getElementById(id); if (el) el.remove(); }

function fmt(t) {
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`\n]+)`/g, '<code style="font-family:var(--font-mono);font-size:11px;background:rgba(255,255,255,.07);padding:1px 4px;border-radius:3px;color:#79c0ff">$1</code>')
    .replace(/✓/g, '<span style="color:var(--online)">✓</span>')
    .replace(/\n/g, '<br>');
}
function esc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 快捷提示词 ──
function renderQuickPrompts() {
  const c = document.getElementById('quickPrompts');
  c.innerHTML = '';
  (PROMPTS[domain][session] || []).forEach(p => {
    const b = document.createElement('div'); b.className = 'qp'; b.textContent = p;
    b.onclick = () => { document.getElementById('chatInput').value = p; sendMessage(); };
    c.appendChild(b);
  });
}

// ── 状态栏 ──
function setSb(id, val, cls) {
  const el = document.getElementById(id);
  el.textContent = val; el.className = 'sb-val ' + (cls || '');
}
function updateSbMid(n) {
  document.getElementById('sbMid').textContent =
    n > 0
      ? `跨会话记忆 ${n} 条 · ${CFG[domain].name} · ${userId}`
      : `Session ${session} · ${CFG[domain].name} · ${userId}`;
}
function resetSB() { setSb('sbLlm','—',''); setSb('sbRecall','—',''); setSb('sbWrite','—',''); }

init();
</script>
